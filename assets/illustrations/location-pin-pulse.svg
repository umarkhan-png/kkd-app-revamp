<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <style>
    .ring{transform-origin:120px 120px;transform-box:view-box;animation:rp 3.4s cubic-bezier(.22,1,.36,1) infinite}
    .r2{animation-delay:1.7s}
    @keyframes rp{0%{transform:scale(.7);opacity:.35}100%{transform:scale(1.7);opacity:0}}
    .pin{transform-origin:120px 120px;transform-box:view-box;animation:bob 3.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#258046"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#10B981" stop-opacity=".18"/><stop offset=".4" stop-color="#10B981" stop-opacity=".07"/><stop offset=".72" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#047857" flood-opacity=".35"/></filter>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#glow)"/>
  <circle class="ring" cx="120" cy="120" r="70" fill="#10B981" fill-opacity=".16"/>
  <circle class="ring r2" cx="120" cy="120" r="70" fill="#10B981" fill-opacity=".10"/>
  <g class="pin">
    <circle cx="120" cy="120" r="46" fill="url(#g)" filter="url(#s)"/>
    <g transform="translate(97 97) scale(1.9166)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-7 8-13a8 8 0 1 0-16 0c0 6 8 13 8 13z"/><circle cx="12" cy="9" r="3"/></g>
  </g>
</svg>
