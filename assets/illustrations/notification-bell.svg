<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <style>
    .dash{transform-origin:90px 90px;transform-box:view-box;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bell{transform-origin:90px 90px;transform-box:view-box;animation:tilt 2.4s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(0)}}
    .pulse{transform-origin:122px 56px;transform-box:view-box;animation:dp 1.6s ease-out infinite}
    @keyframes dp{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.8);opacity:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECFDF5"/><stop offset="1" stop-color="#D1FAE5"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#258046"/></linearGradient>
    <filter id="s1" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#059669" flood-opacity=".25"/></filter>
    <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#047857" flood-opacity=".5"/></filter>
  </defs>
  <circle cx="90" cy="90" r="70" fill="url(#bg)" filter="url(#s1)"/>
  <circle class="dash" cx="90" cy="90" r="61" fill="none" stroke="#059669" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 5"/>
  <g class="bell">
    <circle cx="90" cy="90" r="40" fill="url(#g)" filter="url(#s2)"/>
    <g transform="translate(71 71) scale(1.583)" fill="#fff"><path d="M12 2a6 6 0 0 0-6 6c0 5.2-1.6 7.3-2.6 8.3A1 1 0 0 0 4.1 18h15.8a1 1 0 0 0 .7-1.7C19.6 15.3 18 13.2 18 8a6 6 0 0 0-6-6z"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0z"/></g>
  </g>
  <circle class="pulse" cx="122" cy="56" r="13" fill="none" stroke="#DC2626" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="122" cy="56" r="10.5" fill="#DC2626" stroke="#ECFDF5" stroke-width="2.5"/>
  <text x="122" y="60" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="11" font-weight="900" fill="#fff">3</text>
</svg>
