<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .ring{transform-origin:100px 100px;transform-box:view-box;animation:rp 3.2s cubic-bezier(.22,1,.36,1) infinite}
    .r2{animation-delay:1.6s}
    @keyframes rp{0%{transform:scale(.65);opacity:.35}100%{transform:scale(1.55);opacity:0}}

  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#258046"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#047857" flood-opacity=".4"/></filter>
  </defs>
  <g>
    <circle class="ring" cx="100" cy="100" r="64" fill="#10B981" fill-opacity=".18"/>
    <circle class="ring r2" cx="100" cy="100" r="64" fill="#10B981" fill-opacity=".12"/>
    <circle cx="100" cy="100" r="42" fill="url(#g)" filter="url(#s)"/>
    <g transform="translate(79 79) scale(1.75)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M11 9h.01M15 9h.01M7 13h.01M11 13h.01M15 13h.01M7 17h6"/></g>
  </g>
</svg>
