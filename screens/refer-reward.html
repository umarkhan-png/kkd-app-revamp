<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>KKD · Reward Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{width:390px;height:844px;overflow:hidden;color:#FFFFFF;background:linear-gradient(180deg,#022C22 0%,#258046 50%,#10B981 100%);position:relative}
  .tnum{font-variant-numeric:tabular-nums}
  body::before{content:"";position:absolute;top:-60px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.32) 0%,transparent 65%);pointer-events:none}
  body::after{content:"";position:absolute;bottom:-80px;left:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.18) 0%,transparent 70%);pointer-events:none}

  .close-btn{position:absolute;top:20px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:14px;z-index:11}

  .stage{position:absolute;top:0;left:0;right:0;bottom:148px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;text-align:center;z-index:2}

  .seal-wrap{position:relative;display:inline-block;margin:0 auto}
  .seal{width:92px;height:92px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 48px -12px rgba(0,0,0,0.35),0 0 0 7px rgba(255,255,255,0.18);transform:scale(0) rotate(-15deg);animation:sealIn .7s cubic-bezier(.34,1.56,.64,1) .15s forwards;position:relative;z-index:2}
  @keyframes sealIn{to{transform:scale(1) rotate(0)}}
  .seal i{font-size:42px;color:#258046;opacity:0;animation:checkIn .35s ease-out .6s forwards}
  @keyframes checkIn{to{opacity:1}}
  .seal-ring{position:absolute;inset:-12px;border-radius:50%;border:2px dashed rgba(255,255,255,0.45);animation:ringSpin 14s linear infinite}
  @keyframes ringSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  .eyebrow{margin-top:16px;font-size:11px;font-weight:900;letter-spacing:0.22em;color:#FCD34D;opacity:0;animation:up .5s ease-out .55s forwards}
  .headline{margin-top:8px;font-size:19px;font-weight:900;letter-spacing:-0.01em;line-height:1.28;max-width:300px;opacity:0;animation:up .5s ease-out .68s forwards}
  .emphasis{margin-top:4px;font-size:21px;font-weight:900;letter-spacing:-0.01em;background:linear-gradient(135deg,#FCD34D,#FFFFFF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0;animation:up .5s ease-out .8s forwards}
  .subline{margin-top:10px;font-size:12.5px;color:rgba(255,255,255,0.85);line-height:1.45;max-width:300px;opacity:0;animation:up .5s ease-out .92s forwards}
  .subline .ref-name{color:#FCD34D;font-weight:800}
  @keyframes up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

  .coin-card{margin-top:18px;display:inline-flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.32);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;animation:up .55s ease-out 1.1s forwards}
  .coin-icon{width:44px;height:44px;border-radius:50%;background:#FCD34D;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 14px -4px rgba(0,0,0,0.35)}
  .coin-icon i{font-size:20px;color:#78350F}
  .coin-text{text-align:left}
  .coin-amt{font-size:19px;font-weight:900;color:#FCD34D;letter-spacing:-0.01em}
  .coin-lbl{font-size:11.5px;color:rgba(255,255,255,0.9);font-weight:700;margin-top:1px}
  .coin-valid{font-size:10.5px;color:rgba(255,255,255,0.65);font-weight:600;margin-top:3px}

  .actions{position:absolute;left:0;right:0;bottom:20px;padding:0 24px;z-index:3}
  .btn-primary{width:100%;height:52px;border-radius:14px;background:#FFFFFF;color:#065F46;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 26px -8px rgba(0,0,0,0.35);text-decoration:none}
  .btn-secondary{width:100%;margin-top:10px;height:46px;border-radius:14px;background:transparent;border:1.5px solid rgba(255,255,255,0.55);color:#FFFFFF;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}

  .confetti{position:absolute;width:8px;height:14px;border-radius:2px;top:-20px;opacity:0;animation:cfall 3.2s ease-out forwards;z-index:1}
  @keyframes cfall{0%{transform:translateY(-30px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:0}}
</style>
</head>
<body>

  <span class="confetti" style="left:8%;background:#FCD34D;animation-delay:.2s"></span>
  <span class="confetti" style="left:22%;background:#FFFFFF;animation-delay:.6s"></span>
  <span class="confetti" style="left:36%;background:#10B981;animation-delay:.0s"></span>
  <span class="confetti" style="left:50%;background:#FCD34D;animation-delay:1.0s"></span>
  <span class="confetti" style="left:64%;background:#FFFFFF;animation-delay:.4s"></span>
  <span class="confetti" style="left:78%;background:#10B981;animation-delay:.8s"></span>
  <span class="confetti" style="left:92%;background:#FCD34D;animation-delay:.3s"></span>

  <button class="close-btn" aria-label="Dismiss" onclick="location.href='home.html'"><i class="fa-solid fa-xmark"></i></button>

  <div class="stage">
    <div class="seal-wrap">
      <span class="seal-ring"></span>
      <div class="seal"><i class="fa-solid fa-coins"></i></div>
    </div>
    <div class="eyebrow">Reward earned</div>
    <div class="headline">Rekha Devi placed her first order!</div>
    <div class="emphasis">You earned Katyayani coins</div>
    <div class="subline">Credited to your wallet for referring <b class="ref-name">Rekha Devi</b>, who just completed her first qualifying order.</div>

    <div class="coin-card">
      <div class="coin-icon"><i class="fa-solid fa-coins"></i></div>
      <div class="coin-text">
        <div class="coin-amt tnum" id="coinAmt">₹0 Katyayani Coins</div>
        <div class="coin-lbl">Earned for Rekha Devi's first order</div>
        <div class="coin-valid"><i class="fa-regular fa-circle-check"></i> Credited to your wallet now</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <a href="wallet.html" class="btn-primary"><i class="fa-solid fa-wallet"></i> View Wallet</a>
    <a href="refer.html" class="btn-secondary">Keep Referring</a>
  </div>

  <script>
    (function(){
      var el = document.getElementById('coinAmt');
      var target = 100;
      var duration = 1000;
      function startCount(){
        var start = Date.now();
        var iv = setInterval(function(){
          var t = Math.min((Date.now() - start) / duration, 1);
          var eased = 1 - Math.pow(1 - t, 3);
          el.textContent = '₹' + Math.round(eased * target) + ' Katyayani Coins';
          if (t >= 1) { clearInterval(iv); el.textContent = '₹' + target + ' Katyayani Coins'; }
        }, 16);
      }
      // coin-card fades in at animation-delay 1.1s (duration .55s) — start the count once
      // the card itself has become visible, matching welcome-coins.html's reveal cadence.
      setTimeout(startCount, 1150);
    })();
  </script>
  <script src="../assets/weight-ladder.js"></script>
</body>
</html>
