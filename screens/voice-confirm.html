<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><title>KKD · Voice · Confirm</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* AG-5 rework of PR/SPEC/design-drafts/DI-06/voice-low-confidence.html — kept its exact chrome classes
     (.status-bar/.stk/.search-input/.voice) verbatim, replaced the top-20-30%-only content below the header
     with a full-screen layout per Sagar's 2026-09-16 feedback item 3. Original file untouched — see outputs. */
  *{font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;min-height:100vh;overflow-y:auto;overflow-x:hidden;background:#F8F8F8;color:#0F172A}
  .status-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;font-size:11px;font-weight:800}
  .stk{position:sticky;top:0;z-index:30;background:#FFFFFF;border-bottom:1px solid #F1F5F9;padding:2px 16px 12px;display:flex;align-items:center;gap:10px}
  .stk .back{width:40px;height:40px;border-radius:9999px;background:#FFFFFF;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .search-input{flex:1;position:relative}
  .search-input input{width:100%;height:46px;border-radius:12px;background:#FFFBEB;border:1.5px solid #FCD34D;padding:0 76px 0 42px;font-size:15px;font-weight:600;color:#0F172A;outline:0}
  .search-input .lens{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#B45309;font-size:14px}
  .search-input .edit-ic{position:absolute;right:44px;top:50%;transform:translateY(-50%);color:#B45309;font-size:12px}
  .search-input .voice{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;color:#475569;display:flex;align-items:center;justify-content:center;font-size:14px}

  /* --- v2 full-screen body (was: a 20-30% notice+CTA stack; now: fills the remaining viewport, text weight cut) --- */
  .v2-body{display:flex;flex-direction:column;min-height:calc(844px - 92px);padding:22px 20px 28px;text-align:center}

  .v2-eyebrow{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:800;color:#B45309;text-transform:uppercase;letter-spacing:.06em}
  .v2-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:#F59E0B}

  .v2-headline{font-size:19px;font-weight:900;color:#0F172A;margin-top:10px;line-height:1.3}

  /* Big editable field is the visual centre of the screen — real cursor, real input, unmistakably editable */
  .v2-field-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;margin:18px 0}
  .v2-field{position:relative;background:#FFFFFF;border:2px solid #F59E0B;border-radius:20px;padding:22px 18px;box-shadow:0 10px 30px -12px rgba(245,158,11,0.35)}
  .v2-field .ear{width:34px;height:34px;border-radius:10px;background:#FEF3C7;color:#B45309;display:flex;align-items:center;justify-content:center;font-size:14px;margin:0 auto 10px}
  .v2-field textarea{width:100%;border:0;outline:0;resize:none;background:transparent;text-align:center;font-size:24px;font-weight:800;color:#0F172A;line-height:1.35;caret-color:#258046}
  .v2-cursor{display:inline-block;width:2px;height:22px;background:#258046;vertical-align:middle;margin-left:2px;animation:v2blink 1s step-end infinite}
  @keyframes v2blink{50%{opacity:0}}
  .v2-tapedit{margin-top:10px;font-size:12px;font-weight:800;color:#B45309;display:flex;align-items:center;justify-content:center;gap:6px}

  /* Two unmistakable choices, icon-first for low-literacy legibility */
  .v2-choices{display:flex;flex-direction:column;gap:12px}
  .v2-btn{width:100%;border:0;border-radius:16px;display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;cursor:pointer}
  .v2-btn .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .v2-btn .txt .a,.v2-btn .txt .b{display:block;text-align:left}
  .v2-btn .txt .a{font-size:15px;font-weight:800}
  .v2-btn .txt .b{font-size:11.5px;margin-top:2px;font-weight:500}
  .v2-btn.primary{background:#258046;box-shadow:0 12px 26px -10px rgba(37,128,70,.55)}
  .v2-btn.primary .ic{background:rgba(255,255,255,.18);color:#fff}
  .v2-btn.primary .txt .a{color:#fff}
  .v2-btn.primary .txt .b{color:rgba(255,255,255,.85)}
  .v2-btn.secondary{background:#FFFFFF;border:1.5px solid #FCD34D}
  .v2-btn.secondary .ic{background:#FEF3C7;color:#B45309}
  .v2-btn.secondary .txt .a{color:#0F172A}
  .v2-btn.secondary .txt .b{color:#94A3B8}

  .v2-hint{text-align:center;font-size:11px;color:#94A3B8;margin-top:14px;font-weight:600}
  .badge-img{display:block}
  @keyframes r7echoOut{0%{transform:scale(.7);opacity:.55}100%{transform:scale(2.05);opacity:0}}
  .r7echo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .r7echo img{border-radius:999px;animation:r7echoOut 2.4s ease-out infinite}
  .r7echo img:nth-child(2){animation-delay:.8s}
  .r7echo img:nth-child(3){animation-delay:1.6s}
  .v2-hero-badge{position:relative;width:188px;height:188px;display:flex;align-items:center;justify-content:center;margin:4px auto 0}
</style></head>
<body>

<div class="status-bar"><span>9:41</span><svg width="20" height="11" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="20" height="11" rx="2" stroke="#0F172A" stroke-width="1.5"/><rect x="3" y="3" width="14" height="7" rx="1" fill="#0F172A"/></svg></div>
<div class="stk">
  <button class="back" onclick="location.href='search.html'"><i class="fa-solid fa-arrow-left" style="font-size:12px"></i></button>
  <div class="search-input">
    <i class="fa-solid fa-magnifying-glass lens"></i>
    <input type="text" id="transcript-mini" value="humic for chilli" readonly/>
    <i class="fa-solid fa-pen edit-ic"></i>
    <button class="voice" onclick="location.href='voice-search.html?case=confirm'"><i class="fa-solid fa-microphone"></i></button>
  </div>
</div>

<div class="v2-body">

  
  <div class="v2-hero-badge"><div class="r7echo"><img src="../assets/voice/kkd-badge.png" alt="" style="width:130px;height:130px"><img src="../assets/voice/kkd-badge.png" alt="" style="position:absolute;width:130px;height:130px"><img src="../assets/voice/kkd-badge.png" alt="" style="position:absolute;width:130px;height:130px"></div><img src="../assets/voice/kkd-badge.png" class="badge-img" style="width:130px;height:130px;border-radius:999px;position:relative;z-index:2" alt="Katyayani Krishi Direct badge"/></div>

  <div class="v2-eyebrow"><span class="dot"></span> Medium confidence</div>
  <div class="v2-headline">Is this what you said?</div>

  <div class="v2-field-wrap">
    <div class="v2-field">
      <textarea id="v2-transcript" rows="2" spellcheck="false">humic for chilli</textarea>
      <div class="v2-tapedit"><i class="fa-solid fa-pen"></i> Tap the text to edit it</div>
    </div>
  </div>

  <div class="v2-choices">
    <button class="v2-btn primary" onclick="location.href='search.html?q='+encodeURIComponent(document.getElementById('v2-transcript').value.trim())+'&voice=1'">
      <span class="ic"><i class="fa-solid fa-magnifying-glass"></i></span>
      <span class="txt"><span class="a">Search this</span><span class="b">Looks right — show me results</span></span>
    </button>
    <button class="v2-btn secondary" onclick="document.getElementById('v2-transcript').focus()">
      <span class="ic"><i class="fa-solid fa-pen"></i></span>
      <span class="txt"><span class="a">Fix the words</span><span class="b">Not quite right — change it here</span></span>
    </button>
  </div>

  <div class="v2-hint">Not sent automatically — medium-confidence always waits for one tap.</div>
</div>

<script>
  // Real, focusable, visibly-editable field — cursor blinks on load so a non-fluent reader can SEE this is text
  // they can change, not a label. Auto-focus deliberately OFF (would pop the keyboard immediately over a
  // farmer who may just want to glance and tap Search) — the blinking caret signals editability without
  // forcing the keyboard open.
  const ta = document.getElementById('v2-transcript');
  ta.addEventListener('focus', () => ta.parentElement.style.borderColor = '#258046');
  ta.addEventListener('blur', () => ta.parentElement.style.borderColor = '#F59E0B');
</script>

<script src="../assets/weight-ladder.js"></script>
</body></html>
