<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><title>KKD · Voice · Too much noise</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* AG-5 — chrome (status bar, close/lang row, black canvas, mic-ring keyframes) lifted verbatim from
     LIVE/screens/voice-search.html; body below the "Listening..." label is new — no live equivalent exists
     for this edge case (Sagar invented it 2026-09-16). */
  *{font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .hi{font-family:'Noto Sans Devanagari',sans-serif}
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:#000;color:#fff;overflow:hidden}
  .tnum{font-variant-numeric:tabular-nums}

  /* Two remedy tiles — icon-led, symbol carries the message, text is a caption underneath */
  .remedy{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:18px;padding:16px 14px;text-align:center}
  .remedy .ic{width:52px;height:52px;border-radius:16px;background:rgba(245,158,11,0.18);color:#FCD34D;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 10px;position:relative}
  .remedy .ic .slash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#F87171;opacity:.9}
  .badge-img{display:block}
  @keyframes r7echoOut{0%{transform:scale(.7);opacity:.55}100%{transform:scale(2.05);opacity:0}}
  .r7echo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .r7echo img{border-radius:999px;animation:r7echoOut 2.4s ease-out infinite}
  .r7echo img:nth-child(2){animation-delay:.8s}
  .r7echo img:nth-child(3){animation-delay:1.6s}
</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen relative">


<div class="flex items-center justify-between px-4 pt-3 text-[11px] font-semibold text-white"><span>9:41</span><div class="flex items-center gap-1.5"><svg width="14" height="10" viewBox="0 0 24 18" fill="none"><path d="M2 16h2M6 13h2M10 10h2M14 7h2M18 4h2" stroke="#fff" stroke-width="2.5"/></svg><svg width="14" height="10" viewBox="0 0 24 18" fill="none"><path d="M2 9c5-7 15-7 20 0M6 12c3-4 9-4 12 0M10 15c1-2 3-2 4 0" stroke="#fff" stroke-width="2"/></svg><svg width="20" height="11" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="20" height="11" rx="2" stroke="#fff" stroke-width="1.5"/><rect x="3" y="3" width="14" height="7" rx="1" fill="#fff"/><rect x="22" y="4" width="2" height="5" rx="1" fill="#fff"/></svg></div></div>


<div class="flex items-center justify-between px-4 mt-3">
  <button onclick="location.href='search.html'" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg></button>
  <button class="h-9 px-3 rounded-full bg-white/10 backdrop-blur text-[11px] font-semibold">हिंदी ▾</button>
</div>


<div class="text-center mt-8">
  <div class="text-[11px] font-semibold uppercase tracking-[0.3em] text-[#F59E0B]">Too much noise</div>
  <div class="hi text-[19px] font-extrabold mt-2 leading-tight px-8">बहुत शोर है — साफ़ नहीं सुनाई दे रहा</div>
</div>


<div class="flex flex-col items-center mt-8">
  <div class="relative w-[188px] h-[188px] flex items-center justify-center">
    <div class="r7echo"><img src="../assets/voice/kkd-badge.png" alt="" style="width:130px;height:130px"><img src="../assets/voice/kkd-badge.png" alt="" style="position:absolute;width:130px;height:130px"><img src="../assets/voice/kkd-badge.png" alt="" style="position:absolute;width:130px;height:130px"></div><img src="../assets/voice/kkd-badge.png" class="badge-img" style="width:130px;height:130px;border-radius:999px;position:relative;z-index:2" alt="Katyayani Krishi Direct badge"/>
  </div>
</div>


<div class="px-6 mt-8 grid grid-cols-2 gap-3">
  <div class="remedy">
    <span class="ic">
      <i class="fa-solid fa-house"></i>
      <span class="slash"><i class="fa-solid fa-volume-high" style="font-size:14px;position:absolute;top:2px;right:0px;color:#F87171"></i></span>
    </span>
    <div class="text-[12.5px] font-bold text-white leading-snug">Go somewhere quieter</div>
    <div class="hi text-[11px] mt-1" style="color:rgba(255,255,255,0.6)">शांत जगह पर जाएँ</div>
  </div>
  <div class="remedy">
    <span class="ic"><i class="fa-solid fa-microphone-lines"></i></span>
    <div class="text-[12.5px] font-bold text-white leading-snug">Speak closer to phone</div>
    <div class="hi text-[11px] mt-1" style="color:rgba(255,255,255,0.6)">फ़ोन के पास बोलें</div>
  </div>
</div>


<div class="absolute bottom-6 left-0 right-0 px-6 flex flex-col gap-3">
  <button onclick="location.href='voice-search.html?case=result'" class="w-full h-12 rounded-full text-[#0F172A] text-[14px] font-semibold" style="background:linear-gradient(135deg,#F59E0B,#FCD34D)"><i class="fa-solid fa-microphone mr-2"></i>Try again</button>
  <button onclick="location.href='search.html'" class="w-full h-11 rounded-full bg-white/10 text-white text-[13px] font-semibold">Type instead</button>
</div>
