<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><title>KKD · Voice search</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>

*{font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;box-sizing:border-box}
.hi{font-family:'Noto Sans Devanagari',sans-serif}
html,body{margin:0;padding:0;width:100%;height:100vh;overflow:hidden}
body{background:#0B0F14;color:#fff;display:flex;flex-direction:column}
.tnum{font-variant-numeric:tabular-nums}

/* ---- badge-img / echo — lifted verbatim from the options page ---- */
.badge-img{display:block}
@keyframes echoOut{0%{transform:scale(.7);opacity:.55}100%{transform:scale(2.05);opacity:0}}
.echo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.echo img{width:130px;height:130px;border-radius:999px;animation:echoOut 2.4s ease-out infinite}
.echo img:nth-child(2){animation-delay:.8s}
.echo img:nth-child(3){animation-delay:1.6s}
/* ---- end verbatim block ---- */

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 0 56px;min-height:0}
.transcript-wrap{position:relative;z-index:3;padding:0 20px;text-align:center}
.tlabel{font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#F4A93C}
.ttext{margin-top:8px;font-size:18px;font-weight:800;line-height:1.4;min-height:64px}
.tcommit{color:#fff}
.tpartial{color:rgba(255,255,255,.45);font-style:italic}
.r8-getting-ready{font-size:12px;font-weight:800;color:#F4A93C;margin-top:2px}
</style></head>
<body>


<div class="flex items-center justify-between px-4 pt-3 text-[11px] font-semibold text-white"><span>9:41</span><div class="flex items-center gap-1.5"><svg width="14" height="10" viewBox="0 0 24 18" fill="none"><path d="M2 16h2M6 13h2M10 10h2M14 7h2M18 4h2" stroke="#fff" stroke-width="2.5"/></svg><svg width="14" height="10" viewBox="0 0 24 18" fill="none"><path d="M2 9c5-7 15-7 20 0M6 12c3-4 9-4 12 0M10 15c1-2 3-2 4 0" stroke="#fff" stroke-width="2"/></svg><svg width="20" height="11" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="20" height="11" rx="2" stroke="#fff" stroke-width="1.5"/><rect x="3" y="3" width="14" height="7" rx="1" fill="#fff"/><rect x="22" y="4" width="2" height="5" rx="1" fill="#fff"/></svg></div></div>


<div class="flex items-center justify-between px-4 mt-3">
  <button onclick="if(history.length>1){history.back()}else{location.href='search.html'}" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg></button>
  <button class="h-9 px-3 rounded-full bg-white/10 backdrop-blur text-[11px] font-semibold flex items-center">हिंदी ▾</button>
</div>

<div class="stage">
  <div class="flex flex-col items-center">
    <div class="relative w-[188px] h-[188px] flex items-center justify-center">
      <div class="echo">
        <img src="../assets/voice/kkd-badge.png" alt="">
        <img src="../assets/voice/kkd-badge.png" alt="" style="position:absolute">
        <img src="../assets/voice/kkd-badge.png" alt="" style="position:absolute">
      </div>
      <img src="../assets/voice/kkd-badge.png" class="badge-img" style="width:130px;height:130px;border-radius:999px;position:relative;z-index:2" alt="Katyayani Krishi Direct badge"/>
    </div>
  </div>

  <div class="transcript-wrap">
    <div class="tlabel" id="tlabel">Listening&hellip;</div>
    <div class="r8-getting-ready" id="gettingReady" style="display:none">Getting ready&hellip;</div>
    <div class="ttext hi"><span class="tcommit transcript-committed"></span> <span class="tpartial transcript-partial"></span></div>
  </div>
</div>

<script>
// Live transcription (prototype) · one spoken query, then the outcome screen
//   high confidence → results · medium → "Is this what you said?" · noisy → Too much noise · other language → switch-language widget
(function(){
  var CASES = {
    'result':      { words:['ह्यूमिक','500','ml'],                     go:'search.html?q=' + encodeURIComponent('Humic') + '&voice=1' },
    'confirm':     { words:['humic','for','chilli'],                    go:'voice-confirm.html' },
    'noise':       { words:['मेरी','मिर्च'],                             go:'voice-noise.html' },
    'lang-hi':     { words:['मिर्च','के','लिए','ह्यूमिक'],              go:'voice-lang-hi.html' },
    'lang-hi-low': { words:['मिर्च','के','लिए','ह्यूमिक'],              go:'voice-lang-hi-low.html' },
    'lang-en':     { words:['Humic','for','chilli'],                    go:'voice-lang-en.html' }
  };
  var c = CASES[new URLSearchParams(location.search).get('case')] || CASES['lang-hi'];
  var i = 0, committed = [];
  function paint(){
    var ct = committed.slice(0, -1).join(' '), pt = committed.length ? committed[committed.length - 1] : '';
    document.querySelectorAll('.transcript-committed').forEach(function(el){ el.textContent = ct; });
    document.querySelectorAll('.transcript-partial').forEach(function(el){ el.textContent = pt; });
  }
  // OS mic-init latency · "Getting ready…" for a moment, then Listening…
  var gr = document.getElementById('gettingReady'), tl = document.getElementById('tlabel');
  gr.style.display = ''; tl.style.opacity = '.4';
  setTimeout(function(){
    gr.style.display = 'none'; tl.style.opacity = '';
    var iv = setInterval(function(){
      if (i < c.words.length) { committed.push(c.words[i++]); paint(); return; }
      clearInterval(iv);
      // replace (not push) · Back from the outcome goes to where the mic was tapped, never back into this auto-routing screen
      setTimeout(function(){ location.replace(c.go); }, 900);
    }, 550);
  }, 400);
})();
</script>
<script src="../assets/weight-ladder.js"></script>
</body></html>
